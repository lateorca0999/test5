<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>江戸探索3D</title>

<style>
body{
    margin:0;
    overflow:hidden;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    z-index:10;
    background:rgba(0,0,0,.5);
    padding:10px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<div id="ui">
左スワイプ: 視点回転<br>
右スワイプ: 前進
</div>

<script>

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x87ceeb);

const camera=
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,1.7,0);

const renderer=
new THREE.WebGLRenderer(
{antialias:true}
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const light=
new THREE.DirectionalLight(
0xffffff,
1
);

light.position.set(
20,30,10
);

scene.add(light);

scene.add(
new THREE.AmbientLight(
0xffffff,
0.5
));

const ground=
new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
new THREE.MeshLambertMaterial({
color:0xc2b280
})
);

ground.rotation.x=
-Math.PI/2;

scene.add(ground);

function makeHouse(x,z,color){

const house=
new THREE.Mesh(
new THREE.BoxGeometry(5,4,5),
new THREE.MeshLambertMaterial({
color
})
);

house.position.set(
x,
2,
z
);

scene.add(house);

}

for(let i=0;i<50;i++){

makeHouse(
(Math.random()-0.5)*200,
(Math.random()-0.5)*200,
0x8b5a2b
);

}

const shrine=
new THREE.Mesh(
new THREE.BoxGeometry(
12,
8,
12
),
new THREE.MeshLambertMaterial(
{color:0xff4444}
)
);

shrine.position.set(
20,
4,
40
);

scene.add(shrine);

let angle=0;

let startX=0;

document.addEventListener(
"touchstart",
e=>{
startX=
e.touches[0].clientX;
}
);

document.addEventListener(
"touchend",
e=>{

let dx=
e.changedTouches[0].clientX
-startX;

if(dx<-50){

angle+=Math.PI/8;

}

if(dx>50){

camera.position.x+=
Math.sin(angle)*3;

camera.position.z+=
Math.cos(angle)*3;

}

camera.rotation.y=
-angle;

});

window.addEventListener(
"resize",
()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

function animate(){

requestAnimationFrame(
animate
);

renderer.render(
scene,
camera
);

}

animate();

</script>

</body>
</html>
